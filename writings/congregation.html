<center><h3 style="color: lightcoral;">Congregation</h4></center>
<b><center><p style="color: lightcoral;">Mateo Rubiera</p></center></b>

<center>
	<p style="color: lightcoral;">
		Wistfully sit them: <br>
        Wolves solemnly mourning him. <br>
        Silent bereavement.
	</p>
